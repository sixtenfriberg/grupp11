<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>

<body>
  <div class="page">
    <header class="topbar">
      <h1>ALLA EVENEMANG</h1>
      <div class="count"><span id="count">0</span> RESULTAT</div>
    </header>

    <div class="content">
      <section class="left">
        <div class="card">
          <div class="tabs"></div>

          <form id="searchForm" class="filters" method="get" action="/">
            <!-- SÖK -->
            <div class="filter">
              <div class="label">Sök</div>
              <input
                class="text-input"
                name="keyword"
                type="text"
                placeholder="t.ex. Malmö Arena..."
                value="{{ keyword or '' }}"
              >
            </div>

            <!-- DATUM (START + SLUT I EN DROPDOWN) -->
            <div class="filter filter--span2">
              <div class="label">Datum</div>

              <details class="date-dropdown">
                <summary class="select">
                  <span>
                    {% if start or end %}
                      {{ start or "…" }} - {{ end or "…" }}
                    {% else %}
                      Alla datum
                    {% endif %}
                  </span>
                  <span class="chev">▾</span>
                </summary>

                <div class="date-panel">
                  <div class="date-grid">
                    <div>
                      <div class="panel-label">Startdatum</div>
                      <input class="date-input" name="start" type="date" value="{{ start or '' }}">
                    </div>

                    <div>
                      <div class="panel-label">Slutdatum</div>
                      <input class="date-input" name="end" type="date" value="{{ end or '' }}">
                    </div>
                  </div>

                  <div class="panel-actions">
                    <a class="link" href="/">Återställ</a>
                    <div class="panel-right">
                      <button
                        class="btn outline"
                        type="button"
                        onclick="this.closest('details').removeAttribute('open')"
                      >
                        Avbryt
                      </button>
                      <button class="btn" type="submit">Tillämpa</button>
                    </div>
                  </div>
                </div>
              </details>
            </div>

            <input type="hidden" name="size" value="50">
          </form>

          <p class="meta" id="meta">Sök efter event för att visa resultat på kartan.</p>


          <!-- LISTA: fylls av JS -->
          <div class="events" id="eventsList"></div>


        </div>
      </section>

      <!-- HÖGER -->
      <aside class="right">
        <div class="mapcard">
          <div class="mapheader">Karta</div>
          <div id="map"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  

  <!-- Din kartlogik -->
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
